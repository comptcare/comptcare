<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:#07111f;
}

/* Animated Sky */

.sky{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(#07111f,#102a43,#0b1726);
overflow:hidden;
}

/* Stars */

.sky span{
position:absolute;
background:white;
border-radius:50%;
animation:blink 2s infinite;
}

@keyframes blink{
50%{opacity:.2;}
}

/* Moon */

.moon{
position:absolute;
right:120px;
top:80px;
width:90px;
height:90px;
border-radius:50%;
background:white;
box-shadow:0 0 40px white;
}

/* Ground */

.ground{
position:absolute;
bottom:0;
width:100%;
height:180px;
background:#151515;
}

/* Buildings */

.city{
position:absolute;
bottom:180px;
width:100%;
height:220px;
display:flex;
align-items:flex-end;
gap:20px;
padding:0 20px;
}

.building{
background:#1e293b;
width:90px;
border-radius:5px 5px 0 0;
position:relative;
}

.window{
position:absolute;
width:8px;
height:8px;
background:#ffd54f;
animation:light 3s infinite alternate;
}

@keyframes light{
50%{
opacity:.2;
}
}

/* Road */

.road{
position:absolute;
bottom:80px;
width:100%;
height:70px;
background:#2b2b2b;
overflow:hidden;
}

.line{
position:absolute;
top:32px;
width:100%;
height:5px;
background:
repeating-linear-gradient(
90deg,
white 0 50px,
transparent 50px 100px
);
animation:roadMove 1s linear infinite;
}

@keyframes roadMove{
from{
transform:translateX(0);
}
to{
transform:translateX(-100px);
}
}

/* Character Area */

.character{
position:absolute;
bottom:150px;
left:-180px;
width:150px;
height:250px;
transition:1s;
}

/* Login */

.login{
position:relative;
width:360px;
padding:30px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,.5);
z-index:10;
text-align:center;
}

.login h1{
color:white;
margin-bottom:20px;
}

.login input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:30px;
font-size:16px;
outline:none;
}

.login button{
width:100%;
padding:14px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
background:#00e5ff;
color:black;
font-weight:bold;
transition:.3s;
}

.login button:hover{
transform:scale(1.05);
}

.info{
margin-top:15px;
color:#fff;
font-size:13px;
}


.hero{position:absolute;bottom:0;left:0;width:140px;height:240px;animation:walkIn 6s forwards;}
@keyframes walkIn{0%{left:-180px;}100%{left:780px;}}
.head{width:70px;height:70px;background:#ffd5b5;border-radius:50%;position:absolute;left:35px;}
.hair{width:70px;height:30px;background:#222;border-radius:50px 50px 0 0;}
.eye{width:8px;height:8px;background:#000;border-radius:50%;position:absolute;top:30px;animation:eyeBlink 5s infinite;}
.eye1{left:18px}.eye2{right:18px}
@keyframes eyeBlink{96%{height:8px}98%{height:1px}100%{height:8px}}
.mouth{width:20px;height:8px;border-bottom:3px solid #000;position:absolute;left:25px;top:48px}
.body{width:70px;height:85px;background:#2563eb;position:absolute;top:65px;left:35px;border-radius:15px}
.arm{width:50px;height:10px;background:#ffd5b5;position:absolute;top:90px;border-radius:20px}
.leftArm{left:-5px;animation:larm .5s infinite alternate}.rightArm{right:-5px;animation:rarm .5s infinite alternate}
@keyframes larm{from{transform:rotate(25deg)}to{transform:rotate(-25deg)}}
@keyframes rarm{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
.leg{width:12px;height:75px;background:#222;position:absolute;top:145px}
.leftLeg{left:48px;animation:lleg .5s infinite alternate}.rightLeg{right:48px;animation:rleg .5s infinite alternate}
@keyframes lleg{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes rleg{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}

</style>

<style id="responsive-extra">
@media (max-width:1024px){
.login{width:min(90vw,380px);padding:24px}
.character{transform:scale(.8);transform-origin:bottom left}
.moon{right:40px;top:40px}
}
@media (max-width:768px){
.login{width:92vw;padding:20px}
.login h1{font-size:28px}
.login input,.login button{padding:12px;font-size:15px}
.character{bottom:120px;transform:scale(.65)}
.city{height:160px;gap:10px}
.building{width:50px}
.road{height:55px;bottom:70px}
.ground{height:120px}
}
@media (max-width:480px){
.character{display:none}
.login{width:94vw;border-radius:16px}
.moon{width:60px;height:60px}
}
</style>

</head>

<body>

<div class="moon"></div>

<span style="left:82%;top:22%;width:3px;height:3px;"></span>

<div class="city">

<div class="building" style="height:160px;"></div>
<div class="building" style="height:190px;"></div>
<div class="building" style="height:140px;"></div>
<div class="building" style="height:210px;"></div>

</div>

<div class="line"></div>
</div>

</div>

<!-- Walking Character -->
