```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ComptCare Customer Review</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
    linear-gradient(135deg,#001f3f,#007bff,#00c6ff);

    overflow:hidden;

}


/* Background Glow */

body:before,
body:after{

    content:"";

    position:absolute;

    border-radius:50%;

    filter:blur(70px);

    opacity:.5;

}

body:before{

    width:300px;
    height:300px;

    background:#00ffff;

    top:-100px;
    left:-100px;

}


body:after{

    width:350px;
    height:350px;

    background:#0044ff;

    right:-100px;
    bottom:-100px;

}



.container{

    width:100%;

    max-width:500px;

    padding:35px;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(15px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.3);

    box-shadow:0 20px 50px rgba(0,0,0,.3);

    color:white;

    position:relative;

    z-index:2;

}



.logo{

    text-align:center;

    font-size:34px;

    font-weight:800;

    margin-bottom:10px;

}


.logo span{

    color:#00ffff;

}



h2{

    text-align:center;

    margin-bottom:10px;

}



.subtitle{

    text-align:center;

    margin-bottom:25px;

    opacity:.9;

}



input,
textarea{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:none;

    outline:none;

    border-radius:12px;

    font-size:15px;

}



textarea{

    height:120px;

    resize:none;

}



/* Star Rating */


.rating{

    display:flex;

    justify-content:center;

    flex-direction:row-reverse;

    margin-bottom:20px;

}



.rating input{

    display:none;

}



.rating label{

    font-size:42px;

    color:#ddd;

    cursor:pointer;

    transition:.3s;

}



.rating input:checked ~ label,
.rating label:hover,
.rating label:hover ~ label{

    color:#ffd700;

    transform:scale(1.15);

}



/* Button */


button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:50px;

    background:white;

    color:#007bff;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    background:#00ffff;

    transform:translateY(-3px);

}



#success{

    display:none;

    text-align:center;

    color:#00ff99;

    margin-top:20px;

    font-weight:bold;

}



.footer{

    text-align:center;

    margin-top:20px;

    font-size:13px;

    opacity:.8;

}


</style>

</head>


<body>


<div class="container">


<div class="logo">
Compt<span>Care</span>
</div>


<h2>Customer Review</h2>


<div class="subtitle">
Share your experience with us ⭐
</div>



<form id="reviewForm"

action="https://formspree.io/f/xvgrblga"

method="POST">



<input

type="text"

name="Name"

placeholder="Your Name"

required>



<input

type="email"

name="Email"

placeholder="Your Email (Optional)">



<div class="rating">


<input type="radio" id="star5" name="Rating" value="5" required>
<label for="star5">★</label>


<input type="radio" id="star4" name="Rating" value="4">
<label for="star4">★</label>


<input type="radio" id="star3" name="Rating" value="3">
<label for="star3">★</label>


<input type="radio" id="star2" name="Rating" value="2">
<label for="star2">★</label>


<input type="radio" id="star1" name="Rating" value="1">
<label for="star1">★</label>


</div>



<textarea

name="Review"

placeholder="Write your review..."

required></textarea>



<button type="submit">

🚀 Submit Review

</button>


</form>



<div id="success">

✅ Thank you! Your review has been submitted.

</div>



<div class="footer">

© ComptCare | Computer & IT Services

</div>


</div>




<script>


const form=document.getElementById("reviewForm");


form.addEventListener("submit",async function(e){


e.preventDefault();


let data=new FormData(form);



let response=await fetch(form.action,{

method:"POST",

body:data,

headers:{

"Accept":"application/json"

}

});



if(response.ok){


form.reset();


document.getElementById("success").style.display="block";


}

else{


alert("Something went wrong. Please try again");


}


});


</script>



</body>

</html>
